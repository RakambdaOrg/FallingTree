import java.util.regex.Pattern

buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath("commons-io:commons-io:2.21.0")
    }
}

plugins {
    id("idea")
    alias(libs.plugins.curse)
    alias(libs.plugins.modrinth)
    alias(libs.plugins.names)
    alias(libs.plugins.gitVersion)
}

allprojects {
    apply plugin: "java"
    apply plugin: "idea"

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.compilerArgs = ["-Xlint:deprecation"]
        options.deprecation = true
        options.release.set(25)

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25

        javaToolchains {
            version = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        implementation(libs.jspecify)
        compileOnly(libs.lombok)
        annotationProcessor(libs.lombok)
    }

    repositories {
        maven {
            url "https://libraries.minecraft.net"
            content {
                includeModule("org.lwjgl", "lwjgl-freetype")
            }
        }
        mavenCentral()
        maven {
            name = "Minecraft Libraries"
            url = uri("https://libraries.minecraft.net")
        }
        maven {
            name = 'CurseForge'
            url = 'https://minecraft.curseforge.com/api/maven'
        }
        maven {
            name = "ModMenu"
            url = "https://maven.terraformersmc.com/releases/"
        }
        maven {
            name = "Cloth Config"
            url = "https://maven.shedaniel.me/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Sponge"
                    url = "https://repo.spongepowered.org/repository/maven-public"
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }

    idea {
        module {
            for (fileName in ["run", "out", "logs"]) {
                excludeDirs.add(file(fileName))
            }
        }
    }

    pluginManager.withPlugin("idea") {
        if (tasks.findByName("idePostSync") == null) {
            tasks.register("idePostSync")
        }
    }

    if (version == null || version == "unspecified") {
        try {
            def details = versionDetails()
            if (details.commitDistance > 0) {
                version = "${details.lastTag}-${details.commitDistance}"
            } else {
                version = details.lastTag
            }
        } catch (Exception e) {
            version = "0.0.1-dev"
        }
    }
}

def minecraftVersion = libs.versions.minecraftVersion.get()
group = "fr.rakambda"

base {
    archivesName = "${project.modName}-${minecraftVersion}"
}

def relType = "release"
def isAlpha = false
if (version.contains("b")) {
    relType = "beta"
}
if (version.contains("a") || version.contains("dev") || version.contains("snapshot")) {
    relType = "alpha"
    isAlpha = true
}

tasks.register('buildJar', Jar) {
    group("Modding")
    dependsOn(assemble)
    dependsOn(":common:build")
    if (project.includeFabric.toBoolean()) {
        dependsOn(":fabric:build")
    }
    if (project.includeForge.toBoolean()) {
        dependsOn(":forge:build")
    }
    if (project.includeNeoForge.toBoolean()) {
        dependsOn(":neoforge:build")
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        zipTree("common/build/libs/common-${project.version}.jar")
    }
    if (project.includeFabric.toBoolean()) {
        from {
            zipTree("fabric/build/libs/fabric-${project.version}.jar")
        }
    }
    if (project.includeForge.toBoolean()) {
        from {
            zipTree("forge/build/libs/forge-${project.version}.jar")
        }
    }
    if (project.includeNeoForge.toBoolean()) {
        from {
            zipTree("neoforge/build/libs/neoforge-${project.version}.jar")
        }
    }

    manifest {
        attributes([
                "Specification-Title"     : project.modId,
                "Specification-Vendor"    : "Rakambda",
                "Specification-Version"   : project.version,
                "Implementation-Title"    : project.modName,
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "Rakambda",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
assemble.finalizedBy("buildJar")

static def extractMainVersion(String ver) {
    def match = Pattern.compile("(\\d+\\.\\d+(\\.\\d+)?)(-.*)?").matcher(ver)
    if (match.matches()) {
        return match.group(1)
    }
    return null;
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group("Modding")
    dependsOn("buildJar")

    apiToken = "${project.findProperty("curseforgeApiKey")}"
    disableVersionDetection()

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelog = getFTChangelog() ?: "No changelog provided"
    mainFile.changelogType = "markdown"
    mainFile.displayName = "${minecraftVersion}-${project.version}"
    mainFile.releaseType = relType

    if (project.includeFabric.toBoolean()) {
        mainFile.addOptional("fabric-api") //It's actually required
        mainFile.addOptional("modmenu")
        mainFile.addOptional("cloth-config")
    }
    mainFile.addOptional("cloth-config")

    mainFile.addEnvironment("Client")
    mainFile.addEnvironment("Server")
    mainFile.addJavaVersion("Java 25")

    if (isAlpha) {
        def extracted = extractMainVersion(minecraftVersion)
        if (extracted != null) {
            mainFile.addGameVersion(extracted + "-Snapshot")
        }
    } else {
        mainFile.addGameVersion(minecraftVersion)
    }

    if (project.includeFabric.toBoolean()) {
        mainFile.addModLoader("Fabric")
    }
    if (project.includeForge.toBoolean()) {
        mainFile.addModLoader("Forge")
    }
    if (project.includeNeoForge.toBoolean()) {
        mainFile.addModLoader("NeoForge")
    }
}

modrinth {
    token.set(project.findProperty("modrinthToken") as String)
    projectId.set(project.modrinth_project_id)
    versionNumber.set("${minecraftVersion}-${project.version}")
    versionName.set("${minecraftVersion}-${project.version}")
    uploadFile.set(tasks.jar)
    gameVersions.add(minecraftVersion)
    if (project.includeFabric.toBoolean()) {
        loaders.add("fabric")
    }
    if (project.includeForge.toBoolean()) {
        loaders.add("forge")
    }
    if (project.includeNeoForge.toBoolean()) {
        loaders.add("neoforge")
    }
    versionType.set(relType)
    changelog.set(getFTChangelog() ?: "No changelog provided")
    syncBodyFrom.set(rootProject.file("README.md").getText())
    debugMode.set(false)

    dependencies {
        if (project.includeFabric.toBoolean()) {
            optional.project("P7dR8mSH") //Fabric-api / It's actually required
            optional.project("mOgUt4GM") //Modmenu
        }

        optional.project("9s6osm5g") //Cloth config
    }

    afterEvaluate {
        tasks.named("modrinth").get().dependsOn("buildJar")
    }
}

String getFTChangelog() {
    String changelog = project.findProperty("changelog")
    if (changelog == null) {
        return null;
    }
    if (changelog.startsWith("\"")) {
        changelog = changelog.substring(1)
    }
    if (changelog.endsWith("\"")) {
        changelog = changelog.substring(0, changelog.length() - 1)
    }
    return changelog
}
