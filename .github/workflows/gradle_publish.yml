name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  publish-curseforge:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-minecraft-publish-curseforge.yml@main
    with:
      java-version: "17"
      environment: MinecraftCurseforge
    secrets:
      curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

  publish-modrinth:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-minecraft-publish-modrinth.yml@main
    with:
      java-version: "17"
      environment: MinecraftModrinth
    secrets:
      modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
