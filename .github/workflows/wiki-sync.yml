name: Wiki

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  wiki:
    permissions:
      contents: write
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/sync-wiki.yml@main
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    with:
      path: wiki/
